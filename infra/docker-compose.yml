version: "3.9"

services:
  app:
    image: ai_agent_app:latest
    container_name: ai_agent_app
    ports:
      - "8800:8800"
    environment:
      LLAMA_API_KEY: ""
      HF_TOKEN: ""
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: admin
      MONGO_PASSWORD: secret123 
      MONGO_DB: llm_db
      MONGO_COLLECTION_HISTORY: agent_history
      MONGO_COLLECTION_AGENTS: agents
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7.0
    container_name: local-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret123
      MONGO_INITDB_DATABASE: llm_db
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
      